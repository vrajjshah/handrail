name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch is wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Nothing in CI may reach a model provider. The deterministic path is the
  # gate, and it has to stay honest about that.
  MODEL_MODE: replay

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # Handrail is a CLI that OSS users will run on all three platforms, so the
  # unit suite runs on all three. Browser and eval jobs stay ubuntu-only.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The web app is a Vite bundle, not a tsc `dist`, so `pnpm build` does not
      # cover it. A CSS or bundler failure that typecheck cannot see would
      # otherwise only surface at deploy time.
      - run: pnpm --filter @handrail/web build
      # Two patterns, because the first one alone missed a real leak for weeks:
      # `serve-fixture.ts` lived in a nested `__test__/` folder and is not named
      # `*.test.*`, so it compiled into `dist/` while this check stayed green.
      # `apps/*/dist` is globbed too — the CLI is a published artifact as well.
      - name: dist must not contain test-shaped sources
        run: |
          leaked=$(find packages/*/dist apps/*/dist \
            \( -name '*.test.*' -o -path '*__test__*' \) -print 2>/dev/null || true)
          if [ -n "$leaked" ]; then
            echo "::error::test-shaped output leaked into a published dist directory"
            echo "$leaked"
            exit 1
          fi

  # Browser-driven capture. Ubuntu-only by design: it needs a real Chromium, and
  # the point of the three-OS `unit` matrix is that it stays fast and dependency-free.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve the pinned Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @handrail/engine exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the browser download
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: pnpm --filter @handrail/engine exec playwright install --with-deps chromium

      # The capture suite runs against the real fixture app, not a synthetic
      # document — document coordinates and the accessibility tree only behave
      # correctly on a real origin.
      - run: pnpm --filter @handrail/fixture-seeded-demo build
      - run: pnpm test:browser

  # The durable half: the Drizzle schema, the Postgres store, the pg-boss queue,
  # and #18's acceptance — a scan surviving a worker restart mid-run. Ubuntu-only
  # and separate for the same reason the browser job is: the three-OS `unit`
  # matrix earns its keep by needing nothing but Node.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: handrail
          POSTGRES_PASSWORD: handrail
          POSTGRES_DB: handrail
        ports: ['5432:5432']
        # Without this the job races the database's own startup, and the
        # failure looks like a connection bug rather than a timing one.
        options: >-
          --health-cmd "pg_isready -U handrail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://handrail:handrail@localhost:5432/handrail
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Migrations are an explicit pre-start step in production, so they are an
      # explicit step here too. A CI job that migrated implicitly would not be
      # testing the thing that actually runs.
      - run: pnpm --filter @handrail/server db:migrate

      # The committed migrations must describe the schema. `drizzle-kit check`
      # fails when the schema has drifted from what the SQL files produce, which
      # is how a hand-edited migration or a forgotten `db:generate` is caught.
      - run: pnpm --filter @handrail/server exec drizzle-kit check

      - run: pnpm test:pg

  # A full deterministic scan of the seeded-demo, normalised and diffed against a
  # committed snapshot. This is the only check that sees the whole pipeline at
  # once, so it catches what unit tests structurally cannot: a node running out
  # of order, an event dropping out of the stream, a rollup status flipping.
  golden-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve the pinned Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @handrail/engine exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache the browser download
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: pnpm --filter @handrail/engine exec playwright install --with-deps chromium

      - run: pnpm --filter @handrail/fixture-seeded-demo build
      - run: pnpm --filter @handrail/cli golden:scan

      # Recall against the planted ground truth, in the same job because it needs
      # the same browser and the same built fixture. A drop is a regression; a
      # rise is progress that still has to be recorded deliberately, so both fail
      # until the baseline is re-recorded and the diff reviewed.
      - run: pnpm --filter @handrail/cli recall:baseline

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
